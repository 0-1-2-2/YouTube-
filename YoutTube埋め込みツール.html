<!-- Output: html -->
<!-- File: youtube-embed-generator.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 埋め込みコード生成 & プレビュー</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            padding: 24px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ff4444;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header h1 .icon {
            display: inline-flex;
            background: #ff0000;
            color: #fff;
            width: 36px;
            height: 26px;
            border-radius: 6px;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        header p {
            margin-top: 8px;
            color: #888;
            font-size: 0.9rem;
        }

        /* ===== バナーリンクエリア ===== */
        .banner-link {
            width: 100%;
            background: linear-gradient(135deg, #1e2a3a, #1a1a2e);
            border-bottom: 1px solid #333;
        }

        .banner-link-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .banner-link-inner .banner-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .banner-link-inner .banner-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ============================================================
           ★ 説明文を編集するにはここを変更してください ★
           下の .banner-description の中身を自由に書き換えられます
           ============================================================ */
        .banner-link-inner .banner-description {
            font-size: 0.95rem;
            color: #ccc;
        }

        .banner-link-inner a.banner-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background: #ff0000;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .banner-link-inner a.banner-btn:hover {
            background: #cc0000;
        }

        .banner-link-inner a.banner-btn:active {
            transform: scale(0.97);
        }

        main {
            width: 100%;
            max-width: 900px;
            padding: 30px 20px 60px;
        }

        .input-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .input-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #ccc;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #333;
            border-radius: 8px;
            background: #0f0f0f;
            color: #e0e0e0;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-row input:focus {
            border-color: #ff4444;
        }

        .input-row input::placeholder {
            color: #555;
        }

        .btn-generate {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background: #ff0000;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn-generate:hover {
            background: #cc0000;
        }

        .btn-generate:active {
            transform: scale(0.97);
        }

        .options-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .options-section h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 16px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-group label {
            font-size: 0.85rem;
            color: #999;
        }

        .option-group input[type="number"] {
            padding: 8px 12px;
            font-size: 0.9rem;
            border: 1px solid #333;
            border-radius: 6px;
            background: #0f0f0f;
            color: #e0e0e0;
            outline: none;
            width: 100%;
        }

        .option-group input[type="number"]:focus {
            border-color: #ff4444;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            padding-top: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #ff0000;
            cursor: pointer;
        }

        .checkbox-group span {
            font-size: 0.9rem;
            color: #ccc;
        }

        .error-msg {
            display: none;
            background: #3a1a1a;
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            color: #ff6666;
            font-size: 0.9rem;
        }

        .error-msg.show {
            display: block;
        }

        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .preview-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .preview-section h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 16px;
        }

        .preview-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .code-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .code-section h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-copy {
            padding: 6px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid #555;
            border-radius: 6px;
            background: transparent;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-copy:hover {
            background: #333;
            border-color: #777;
        }

        .btn-copy.copied {
            background: #1a3a1a;
            border-color: #4caf50;
            color: #4caf50;
        }

        .code-block {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
        }

        .code-block code {
            font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            color: #c8e6c9;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
        }

        .url-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
        }

        .url-section h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .url-display {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.85rem;
            color: #90caf9;
            word-break: break-all;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.2rem;
            }

            .input-row {
                flex-direction: column;
            }

            .btn-generate {
                width: 100%;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            main {
                padding: 20px 12px 40px;
            }

            .banner-link-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .banner-link-inner a.banner-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>
        <span class="icon">▶</span>
        YouTube 埋め込みコード生成 & プレビュー
    </h1>
    <p>YouTubeのURLを貼り付けて、埋め込みコードを生成・プレビューできます</p>
</header>

<!-- ================================================================
     ★★★ バナーリンクエリア ★★★
     - リンク先URL → <a> タグの href="..." を変更
     - ボタンの表示テキスト → <a> タグの中のテキストを変更
     - 説明文 → class="banner-description" の中のテキストを変更
     - ラベル → class="banner-label" の中のテキストを変更
     ================================================================ -->
<div class="banner-link">
    <div class="banner-link-inner">
        <div class="banner-text">
            <!-- ▼ ラベル（小さい文字）を編集 ▼ -->
            <span class="banner-label">📌 ここから！</span>
            <!-- ▼ 説明文を編集 ▼ -->
            <span class="banner-description">YouTubeのリンクを検索するのはここから！</span>
        </div>
        <!-- ▼ href="" 内のURLと、ボタン表示テキストを編集 ▼ -->
        <a class="banner-btn" href="https://www.yahoo.co.jp/" target="_blank" rel="noopener noreferrer">
            Yahoo! JAPAN を開く →
        </a>
    </div>
</div>
<!-- ================================================================ -->

<main>
    <div class="input-section">
        <label for="youtube-url">YouTube URL を入力</label>
        <div class="input-row">
            <input
                type="text"
                id="youtube-url"
                placeholder="例: https://www.youtube.com/watch?v=xxxx や https://youtu.be/xxxx"
                autocomplete="off"
            >
            <button class="btn-generate" id="btn-generate" type="button">生成</button>
        </div>
    </div>

    <div class="options-section">
        <h2>⚙ オプション設定</h2>
        <div class="options-grid">
            <div class="option-group">
                <label for="opt-width">幅 (px)</label>
                <input type="number" id="opt-width" value="560" min="200" max="1920">
            </div>
            <div class="option-group">
                <label for="opt-height">高さ (px)</label>
                <input type="number" id="opt-height" value="315" min="100" max="1080">
            </div>
            <div class="option-group">
                <label for="opt-start">開始位置 (秒)</label>
                <input type="number" id="opt-start" value="0" min="0">
            </div>
            <div class="option-group checkbox-group">
                <input type="checkbox" id="opt-autoplay">
                <span>自動再生</span>
            </div>
            <div class="option-group checkbox-group">
                <input type="checkbox" id="opt-loop">
                <span>ループ再生</span>
            </div>
            <div class="option-group checkbox-group">
                <input type="checkbox" id="opt-controls" checked>
                <span>コントロール表示</span>
            </div>
        </div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="result-section" id="result-section">
        <div class="preview-section">
            <h2>🎬 プレビュー</h2>
            <div class="preview-container" id="preview-container"></div>
        </div>

        <div class="code-section">
            <h2>
                📋 iframe 埋め込みコード
                <button class="btn-copy" id="btn-copy-iframe" type="button">コピー</button>
            </h2>
            <div class="code-block">
                <code id="code-iframe"></code>
            </div>
        </div>

        <div class="url-section">
            <h2>
                🔗 埋め込みURL
                <button class="btn-copy" id="btn-copy-url" type="button">コピー</button>
            </h2>
            <div class="url-display" id="embed-url"></div>
        </div>
    </div>
</main>

<script>
    const inputUrl = document.getElementById('youtube-url');
    const btnGenerate = document.getElementById('btn-generate');
    const errorMsg = document.getElementById('error-msg');
    const resultSection = document.getElementById('result-section');
    const previewContainer = document.getElementById('preview-container');
    const codeIframe = document.getElementById('code-iframe');
    const embedUrlDisplay = document.getElementById('embed-url');
    const btnCopyIframe = document.getElementById('btn-copy-iframe');
    const btnCopyUrl = document.getElementById('btn-copy-url');

    function extractVideoId(url) {
        url = url.trim();
        let match;

        match = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
        if (match) return match[1];

        match = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
        if (match) return match[1];

        match = url.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/);
        if (match) return match[1];

        match = url.match(/youtube\.com\/v\/([a-zA-Z0-9_-]{11})/);
        if (match) return match[1];

        match = url.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/);
        if (match) return match[1];

        match = url.match(/youtube\.com\/live\/([a-zA-Z0-9_-]{11})/);
        if (match) return match[1];

        match = url.match(/^([a-zA-Z0-9_-]{11})$/);
        if (match) return match[1];

        return null;
    }

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('show');
        resultSection.classList.remove('show');
    }

    function hideError() {
        errorMsg.classList.remove('show');
    }

    function buildEmbedUrl(videoId) {
        const params = new URLSearchParams();

        const start = parseInt(document.getElementById('opt-start').value, 10);
        if (start > 0) params.set('start', start);

        if (document.getElementById('opt-autoplay').checked) {
            params.set('autoplay', '1');
        }

        if (document.getElementById('opt-loop').checked) {
            params.set('loop', '1');
            params.set('playlist', videoId);
        }

        if (!document.getElementById('opt-controls').checked) {
            params.set('controls', '0');
        }

        const paramStr = params.toString();
        return 'https://www.youtube.com/embed/' + videoId + (paramStr ? '?' + paramStr : '');
    }

    function generate() {
        hideError();
        const url = inputUrl.value.trim();

        if (!url) {
            showError('URLを入力してください。');
            return;
        }

        const videoId = extractVideoId(url);
        if (!videoId) {
            showError('有効なYouTubeのURLを入力してください。対応形式: youtube.com/watch?v=..., youtu.be/..., youtube.com/shorts/... など');
            return;
        }

        const width = parseInt(document.getElementById('opt-width').value, 10) || 560;
        const height = parseInt(document.getElementById('opt-height').value, 10) || 315;
        const embedUrl = buildEmbedUrl(videoId);

        const iframeCode = '<iframe\n'
            + '  width="' + width + '"\n'
            + '  height="' + height + '"\n'
            + '  src="' + embedUrl + '"\n'
            + '  title="YouTube video player"\n'
            + '  frameborder="0"\n'
            + '  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"\n'
            + '  allowfullscreen\n'
            + '></iframe>';

        previewContainer.innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.title = 'YouTube video player';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        iframe.allowFullscreen = true;
        previewContainer.appendChild(iframe);

        codeIframe.textContent = iframeCode;
        embedUrlDisplay.textContent = embedUrl;

        resultSection.classList.add('show');
        resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function copyToClipboard(text, btn) {
        navigator.clipboard.writeText(text).then(function () {
            btn.textContent = '✓ コピーしました';
            btn.classList.add('copied');
            setTimeout(function () {
                btn.textContent = 'コピー';
                btn.classList.remove('copied');
            }, 2000);
        }).catch(function () {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                btn.textContent = '✓ コピーしました';
                btn.classList.add('copied');
                setTimeout(function () {
                    btn.textContent = 'コピー';
                    btn.classList.remove('copied');
                }, 2000);
            } catch (e) {
                btn.textContent = '失敗';
                setTimeout(function () {
                    btn.textContent = 'コピー';
                }, 2000);
            }
            document.body.removeChild(textarea);
        });
    }

    btnGenerate.addEventListener('click', generate);

    inputUrl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            generate();
        }
    });

    btnCopyIframe.addEventListener('click', function () {
        copyToClipboard(codeIframe.textContent, btnCopyIframe);
    });

    btnCopyUrl.addEventListener('click', function () {
        copyToClipboard(embedUrlDisplay.textContent, btnCopyUrl);
    });
</script>

</body>
</html>
